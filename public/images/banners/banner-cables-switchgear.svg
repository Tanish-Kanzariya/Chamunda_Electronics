<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bgGrad2)" />

  <!-- Technical Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect width="280" height="36" rx="18" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#22c55e" />
    <text x="36" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4ade80" letter-spacing="1">
      INDUSTRIAL &amp; CONTRACTOR GRADE
    </text>

    <text x="0" y="85" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff">
      Heavy-Duty Wires, Cables
    </text>
    <text x="0" y="138" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#neonGreen)">
      &amp; Modular Switchgear
    </text>

    <text x="0" y="185" font-family="system-ui, sans-serif" font-size="17" fill="#cbd5e1">
      Polycab FR-LSH Copper Wires • Schneider MCBs • Finolex Submersible
    </text>
    <text x="0" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Bulk contractor rates with verified GST invoices and credit billing facility.
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 245)">
      <rect width="130" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">COPPER PURITY</text>
      <text x="16" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">99.97% EC</text>

      <g transform="translate(145, 0)">
        <rect width="130" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">BREAKING CAP.</text>
        <text x="16" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">10kA MCBs</text>
      </g>

      <g transform="translate(290, 0)">
        <rect width="130" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">DISPATCH TIME</text>
        <text x="16" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#facc15">&lt; 24 Hours</text>
      </g>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 325)">
      <rect width="190" height="48" rx="24" fill="url(#neonGreen)" filter="url(#shadow2)" />
      <text x="35" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#052e16">
        Order Bulk Wires ➔
      </text>

      <g transform="translate(210, 0)">
        <rect width="170" height="48" rx="24" fill="none" stroke="#64748b" stroke-width="1.5" />
        <text x="30" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
          Get Price List
        </text>
      </g>
    </g>
  </g>

  <!-- Right Visual Feature -->
  <g transform="translate(780, 70)" filter="url(#shadow2)">
    <!-- Main Industrial Panel Display -->
    <rect width="360" height="340" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="20" y="20" width="320" height="300" rx="14" fill="#1e293b" />
    
    <!-- MCB Array Simulation -->
    <rect x="40" y="40" width="280" height="110" rx="8" fill="#334155" />
    <g transform="translate(55, 52)">
      <rect width="45" height="85" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="18" y="20" width="10" height="25" rx="2" fill="#ef4444" />
      <text x="22" y="70" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#0f172a">C16</text>
    </g>
    <g transform="translate(110, 52)">
      <rect width="45" height="85" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="18" y="20" width="10" height="25" rx="2" fill="#ef4444" />
      <text x="22" y="70" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#0f172a">C25</text>
    </g>
    <g transform="translate(165, 52)">
      <rect width="45" height="85" rx="4" fill="#ffffff" stroke="#cbd5e1" />
      <rect x="18" y="38" width="10" height="25" rx="2" fill="#22c55e" />
      <text x="22" y="70" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#0f172a">C32</text>
    </g>
    <g transform="translate(220, 52)">
      <rect width="80" height="85" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="2" />
      <rect x="32" y="20" width="16" height="28" rx="2" fill="#0f172a" />
      <text x="40" y="72" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#dc2626">RCCB 63A</text>
    </g>

    <!-- Cable Coils Visual -->
    <g transform="translate(40, 175)">
      <rect width="280" height="125" rx="10" fill="#0f2942" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="70" cy="62" r="42" fill="none" stroke="#ea580c" stroke-width="14" />
      <circle cx="70" cy="62" r="22" fill="#0f172a" />
      <text x="70" y="66" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#ffffff">POLYCAB</text>

      <text x="135" y="48" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">90-Meter Factory Coils</text>
      <text x="135" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">1.0mm, 1.5mm, 2.5mm, 4.0mm</text>
      <text x="135" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#4ade80">Contractor Pricing</text>
    </g>
  </g>
</svg>
