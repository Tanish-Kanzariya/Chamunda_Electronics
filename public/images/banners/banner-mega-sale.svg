<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b30" />
      <stop offset="45%" stop-color="#0f4c81" />
      <stop offset="85%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" rx="24" fill="url(#bgGrad)" />

  <!-- Decorative Circuit Wave Lines -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M -50 380 Q 200 240, 500 360 T 1000 260 T 1300 320" />
    <path d="M -50 420 Q 300 280, 650 400 T 1150 300 T 1350 360" />
    <circle cx="200" cy="240" r="5" fill="#38bdf8" />
    <circle cx="500" cy="360" r="5" fill="#38bdf8" />
    <circle cx="1000" cy="260" r="6" fill="#fbbf24" />
    <circle cx="650" cy="400" r="4" fill="#38bdf8" />
  </g>

  <!-- Glowing Aura behind Products -->
  <ellipse cx="940" cy="250" rx="220" ry="180" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="940" cy="240" r="160" fill="#38bdf8" opacity="0.06" />

  <!-- LEFT COLUMN: Promotional Content -->
  <!-- Top Offer Pill -->
  <g transform="translate(60, 55)">
    <rect width="320" height="38" rx="19" fill="#0b2545" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="22,12 14,24 20,24 16,34 26,18 20,18" fill="#fbbf24" />
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="0.5">
      FESTIVE MEGA ELECTRICAL SALE
    </text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Powering Your Projects with
  </text>
  <text x="60" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="-0.5">
    100% Genuine Supplies
  </text>

  <!-- Subtitle -->
  <text x="60" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#cbd5e1" font-weight="400">
    Polycab Wires • Havells Switchgear • Philips LED • BLDC Fans
  </text>
  <text x="60" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
    Direct wholesale pricing with GST invoice &amp; express same-day dispatch.
  </text>

  <!-- Discount Highlights Badge -->
  <g transform="translate(60, 305)">
    <!-- Red Discount Tag -->
    <rect width="180" height="52" rx="12" fill="url(#badgeGrad)" filter="url(#shadow)" />
    <text x="18" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fecaca" text-transform="uppercase" letter-spacing="1">
      SPECIAL DISCOUNT
    </text>
    <text x="18" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">
      UP TO 45% OFF
    </text>

    <!-- Secondary Guarantee Tag -->
    <g transform="translate(195, 0)">
      <rect width="195" height="52" rx="12" fill="#0f2942" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="26" r="14" fill="#10b981" opacity="0.2" />
      <path d="M22 26 L26 30 L34 22" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <text x="48" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
        ISI &amp; CE Certified
      </text>
      <text x="48" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        100% Original Products
      </text>
    </g>
  </g>

  <!-- CTA Button Area -->
  <g transform="translate(60, 385)">
    <!-- Main CTA Button -->
    <rect width="180" height="48" rx="24" fill="url(#goldGrad)" filter="url(#shadow)" />
    <text x="40" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a">
      Shop Now ➔
    </text>

    <!-- Secondary Coupon Tag -->
    <g transform="translate(200, 4)">
      <rect width="210" height="40" rx="8" fill="rgba(255,255,255,0.08)" stroke="#64748b" stroke-dasharray="4 4" stroke-width="1" />
      <text x="15" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">
        Use Coupon: <tspan font-weight="800" fill="#fbbf24">CHAMUNDA10</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Showcase Cards -->
  <g transform="translate(760, 60)" filter="url(#shadow)">
    <!-- Card 1: Polycab Wire Coil -->
    <g transform="translate(30, 20)">
      <rect width="170" height="190" rx="18" fill="#ffffff" />
      <rect width="170" height="190" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Wire Visual -->
      <circle cx="85" cy="80" r="55" fill="none" stroke="#dc2626" stroke-width="16" />
      <circle cx="85" cy="80" r="42" fill="none" stroke="#ef4444" stroke-width="6" />
      <circle cx="85" cy="80" r="28" fill="#0f172a" />
      <text x="85" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fbbf24">POLYCAB</text>
      <!-- Label -->
      <text x="85" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FlameGard 2.5mm</text>
      <text x="85" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#16a34a">Starting ₹2,150</text>
    </g>

    <!-- Card 2: LED Slim Panel (Right) -->
    <g transform="translate(225, 60)">
      <rect width="160" height="180" rx="18" fill="#ffffff" />
      <rect width="160" height="180" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- LED Panel Visual -->
      <rect x="35" y="25" width="90" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
      <rect x="42" y="32" width="76" height="56" rx="4" fill="#fef08a" opacity="0.8" />
      <circle cx="80" cy="60" r="16" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
      <!-- Label -->
      <text x="80" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Philips 15W LED</text>
      <text x="80" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#16a34a">₹499 (Save 38%)</text>
    </g>

    <!-- Card 3: BLDC Fan / Modular Switch (Bottom Overlap) -->
    <g transform="translate(90, 190)">
      <rect width="210" height="140" rx="18" fill="#ffffff" />
      <rect width="210" height="140" rx="18" fill="none" stroke="#f59e0b" stroke-width="2" />
      <!-- Badge -->
      <rect x="15" y="12" width="75" height="20" rx="10" fill="#dbeafe" />
      <text x="52" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1e40af">BLDC SMART</text>
      <!-- Fan visual -->
      <circle cx="150" cy="65" r="32" fill="#f1f5f9" />
      <circle cx="150" cy="65" r="12" fill="#0f4c81" />
      <line x1="150" y1="33" x2="150" y2="15" stroke="#0f4c81" stroke-width="6" stroke-linecap="round" />
      <line x1="123" y1="80" x2="108" y2="92" stroke="#0f4c81" stroke-width="6" stroke-linecap="round" />
      <line x1="177" y1="80" x2="192" y2="92" stroke="#0f4c81" stroke-width="6" stroke-linecap="round" />
      <!-- Text details -->
      <text x="18" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Crompton 35W</text>
      <text x="18" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Remote Controlled</text>
      <text x="18" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#dc2626">₹2,899</text>
      <text x="80" y="105" font-family="system-ui, sans-serif" font-size="11" text-decoration="line-through" fill="#94a3b8">₹4,200</text>
    </g>
  </g>
</svg>
